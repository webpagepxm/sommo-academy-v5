function renderManual(){main.innerHTML=`<div class="wrap screen manual"><button class="back" data-page="home">← Volver al inicio</button><div class="eyebrow" style="margin-top:20px">ACADEMY / LECTURAS / 01</div><h1 class="intro-title">Protocolos<br><em>de servicio.</em></h1><p class="intro-lede">Una guía breve para mejorar el ritmo del servicio, la comodidad de los clientes y el trabajo en equipo. Este material es una propuesta para capacitación; no sustituye el protocolo interno aprobado por SOMMO.</p>
 <article class="article"><div class="eyebrow">MANUAL DE PISO · EDICIÓN 01</div><h2>La atención está<br>en los detalles.</h2><p>Un excelente servicio permite que el cliente disfrute la experiencia sin tener que solicitar cada cosa. Estar presente no significa interrumpir constantemente: significa observar, anticiparse y actuar con discreción.</p>
 <h3>01. Una mesa sin «muertos»</h3><p>En servicio, se llama de manera coloquial <strong>«muertos»</strong> a platos vacíos o sucios, vasos usados, servilletas y otros objetos que ya no se necesitan. El objetivo es mantener la mesa cómoda, limpia y ordenada.</p>
 <ul><li>No dejar que se acumulen platos, vasos y utensilios innecesarios.</li><li>Observar cuándo un comensal ha terminado sin apresurarlo.</li><li><strong>Preguntar antes de retirar:</strong> no asumir que un vaso vacío ya puede llevarse o que alguien ha terminado de comer.</li><li>No retirar un plato mientras su dueño sigue comiendo ni interrumpir una conversación innecesariamente.</li><li>Retirar con movimientos seguros, discretos y sin cruzar sobre el comensal.</li></ul>
 <blockquote>«¿Me permite retirar su plato?»<br>«¿Ya terminó o prefiere que se lo deje?»</blockquote>
 <h3>02. Orden y protocolo de servicio</h3><p>En el <strong>protocolo clásico de restaurante</strong>, el orden de servicio se organiza por precedencia y edad. Como referencia para aprender la técnica tradicional:</p>
 <ol><li><strong>Invitado o invitada de honor:</strong> se atiende primero cuando la mesa identifica a una persona homenajeada o invitada especial.</li><li><strong>Mujeres:</strong> se comienza por la de mayor edad y se continúa con las demás.</li><li><strong>Hombres:</strong> se comienza por el de mayor edad y se continúa con los demás.</li><li><strong>Anfitrión o anfitriona:</strong> se sirve al final, después de sus invitados.</li></ol>
 <p><strong>¿Y los niños?</strong> Cuando hay niños pequeños, se procura servirles <strong>lo antes posible</strong>, sin hacerlos esperar hasta terminar toda la secuencia. También se atienden con prioridad práctica las necesidades de personas que requieren asistencia.</p>
 <p><strong>Sentido de servicio:</strong> para desplazarse con orden, se puede continuar <strong>en el sentido de las manecillas del reloj</strong> dentro de cada grupo. Si se aplica prioridad por edad o hay una persona de honor, esta precedencia puede modificar el recorrido.</p>
 <div class="notice"><strong>Aplicación en SOMMO:</strong> este es un protocolo tradicional, no una regla universal. Gerencia debe confirmar si el servicio del restaurante seguirá esta secuencia o utilizará números de asiento y atención por necesidades, como sucede en muchos establecimientos actuales. En cualquier caso, no retrasar los alimentos ni comprometer su temperatura, seguridad o la comodidad de los comensales.</div>
 <p style="font-size:12px;opacity:.68">Referencias de formación: <a href="https://www3.gobiernodecanarias.org/medusa/ecoblog/avennav/la-comanda/" target="_blank" rel="noopener noreferrer">Servicios en Restauración · Gobierno de Canarias</a> · <a href="https://www.webstaurantstore.com/article/90/fine-dining-etiquette-for-servers.html" target="_blank" rel="noopener noreferrer">Fine Dining Etiquette for Servers</a>.</p>
 <h3>03. Anticiparse sin invadir</h3><ul><li>Dar la bienvenida con naturalidad y explicar la carta sin presionar.</li><li>Confirmar alergias, modificaciones y tiempos antes de enviar la comanda.</li><li>Observar el ritmo de la mesa y preguntar antes de ofrecer retirar objetos.</li><li>Consultar a cocina o barra cuando desconozcas un ingrediente o preparación.</li><li>Informar a tiempo si algo se agota o se retrasa; nunca inventar tiempos.</li><li>Preparar la mesa para los siguientes clientes únicamente después de limpiarla y remontarla correctamente.</li></ul>
 <h3>04. Hospitalidad también es seguridad</h3><p>Las alergias no se resuelven retirando un ingrediente del plato. Deben comunicarse a cocina y verificarse ingredientes, preparación y posible contacto cruzado. Ante cristalería rota o un plato caliente, protege al cliente y sigue las medidas de seguridad.</p>
 </article><div class="actions-row"><button data-start="piso">Practicar · primer día en piso ↗</button><button data-page="home">Volver a las evaluaciones</button></div></div>`}


function renderLogin(){
  main.innerHTML=`<div class="wrap screen"><button class="back" data-page="home">← Volver al inicio</button><div class="eyebrow" style="margin-top:20px">ACCESO / PERSONAL</div><h1 class="intro-title">Inicia<br><em>sesión.</em></h1><p class="intro-lede">Usa el correo y contraseña del empleado creado en Supabase Authentication.</p><div class="intro-panel"><form class="panel" id="loginForm"><h3>${profile?'Tu cuenta':'Accede a Academy'}</h3>${profile?`<p>Sesión activa: <strong>${ESC(profile.nombre)}</strong></p><button type="button" class="wide-btn" id="logout">Cerrar sesión →</button>`:`<div class="field"><label for="mail">Correo electrónico</label><input id="mail" type="email" autocomplete="email" required placeholder="tu@correo.com"></div><div class="field"><label for="pass">Contraseña</label><input id="pass" type="password" autocomplete="current-password" required placeholder="Tu contraseña"></div><div style="height:22px"></div><button class="wide-btn" type="submit" id="loginBtn">Entrar a Academy <span>↗</span></button><button type="button" class="ghost-link" data-page="forgot" style="border:0;background:none;color:#e7e0d0;margin-top:17px;cursor:pointer">Olvidé mi contraseña ↗</button>`}<p class="auth-error" id="authError" hidden></p></form><aside class="panel"><span class="pill">ACCESO SEGURO</span><div class="tip-list"><div class="tip"><b>Tu identidad, vinculada a tus resultados.</b><br>Al ingresar, SOMMO reconoce el perfil de empleado registrado.</div><div class="tip"><b>Exámenes seguros.</b><br>El navegador recibe preguntas, pero la clave de respuestas permanece en Supabase.</div><div class="tip"><b>Datos privados.</b><br>Solo podrás consultar tu propio historial. El panel gerencial se habilitará más adelante.</div></div></aside></div></div>`;
  document.getElementById('logout')?.addEventListener('click',async()=>{await client.auth.signOut();profile=null;exam=null;latestResult=null;navigate('home')});
  document.getElementById('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();const b=document.getElementById('loginBtn'),err=document.getElementById('authError');
    b.disabled=true;b.textContent='Entrando…';err.hidden=true;
    try{
      if(!client)throw Error('No se cargó Supabase. Revisa la conexión a internet.');

      const {data,error:perr}=await client.rpc('sommo_mi_perfil');

    }catch(ex){err.textContent='No se pudo entrar: '+(ex.message||String(ex));err.hidden=false;}

function renderResetPassword(){
  main.innerHTML=`<div class="wrap screen"><div class="eyebrow" style="margin-top:20px">ACCESO / NUEVA CONTRASEÑA</div><h1 class="intro-title">Cambia tu<br><em>contraseña.</em></h1><p class="intro-lede">Has llegado desde tu enlace de recuperación. Elige una contraseña nueva y guárdala en un gestor de contraseñas.</p><div class="intro-panel"><form class="panel" id="resetForm"><h3>Nuevo acceso.</h3><div class="field"><label for="newPass">Contraseña nueva (mínimo 10 caracteres)</label><input id="newPass" type="password" autocomplete="new-password" minlength="10" required></div><div class="field"><label for="repeatPass">Confirmar contraseña</label><input id="repeatPass" type="password" autocomplete="new-password" minlength="10" required></div><button class="wide-btn" type="submit" id="resetBtn">Guardar nueva contraseña <span>↗</span></button><p class="auth-error" id="resetError" hidden></p></form><aside class="panel"><span class="pill">ACCESO PERSONAL</span><div class="tip-list"><div class="tip"><b>La contraseña solo la escribes aquí.</b><br>No la compartas por WhatsApp ni en el chat.</div><div class="tip"><b>No cambia tu registro.</b><br>Seguirás teniendo el mismo perfil de empleado y tus resultados.</div></div></aside></div></div>`;
  document.getElementById('resetForm').addEventListener('submit',async e=>{
    e.preventDefault();const b=document.getElementById('resetBtn'),err=document.getElementById('resetError');err.hidden=true;
    const p=document.getElementById('newPass').value,again=document.getElementById('repeatPass').value;
    if(p!==again){err.hidden=false;err.textContent='Las contraseñas no coinciden.';return;}
    b.disabled=true;b.textContent='Guardando…';
    try{
      if(!client)throw Error('No se cargó Supabase.');
      const {error}=await client.auth.updateUser({password:p});
      if(error)throw error;
      // Nunca dejar tokens del enlace de recuperación en la barra de direcciones.
      if(location.hash)history.replaceState(null,'',location.pathname+location.search);
      recoveryRequested=false;
      const {data,error:perr}=await client.rpc('sommo_mi_perfil');
      if(!perr&&data)profile=data;
      main.innerHTML=`<div class="wrap screen"><div class="eyebrow">ACCESO / LISTO</div><h1 class="intro-title">Contraseña<br><em>actualizada.</em></h1><p class="intro-lede">Ya puedes entrar a SOMMO Academy con tu contraseña nueva.</p><div class="actions-row"><button data-page="${profile?'home':'login'}">${profile?'Ir a mi Academy':'Iniciar sesión'} ↗</button></div></div>`;
      navState();
    }catch(ex){err.hidden=false;err.textContent='No se pudo guardar: '+(ex.message||String(ex));}
    finally{b.disabled=false;b.textContent='Guardar nueva contraseña ↗'}
  });
}

function renderStart(){
  if(!profile){navigate('login');return}

  document.getElementById('examForm').addEventListener('submit',async e=>{
    e.preventDefault();if(busy)return;busy=true;
    const btn=document.getElementById('startButton'),errorBox=document.getElementById('examError');btn.disabled=true;btn.textContent='Preparando preguntas…';
    try{
      const {data,error}=await client.rpc('sommo_iniciar_examen',{p_tipo:selectedExamType});
      if(error)throw error;

      exam={id:data.intento_id,type:selectedExamType,name:profile.nombre,items:data.preguntas.map(q=>({...q,options:shuffle(q.opciones.map(o=>({label:o.texto,original:o.id})))})),answers:Array(18).fill(null),index:0};
      navigate('exam');

    finally{busy=false;btn.disabled=false;btn.textContent='Iniciar examen ↗'}
  });

function renderExam(){
  if(!exam){navigate('home');return}
  const i=exam.index,q=exam.items[i],answered=exam.answers.filter(x=>x!==null).length;
  main.innerHTML=`<div class="wrap screen"><button class="back" id="leaveExam">← Salir del examen</button><div class="exam-head"><div><div class="eyebrow">${ESC(menus[exam.type].name)} · ${ESC(exam.name)}</div><h1 style="font:400 42px var(--serif);margin:15px 0 0">Evaluación en curso.</h1></div><span class="mono">${answered} DE 18 RESPONDIDAS</span></div><div class="progress-track"><div class="progress-fill" style="width:${answered/18*100}%"></div></div><section class="question-card"><div class="q-top"><span class="mono">PREGUNTA ${String(i+1).padStart(2,'0')} / 18</span><span class="mono">${ESC(q.categoria)}</span></div><h2>${ESC(q.pregunta)}</h2><div class="options" role="radiogroup" aria-label="Opciones de respuesta">${q.options.map((o,j)=>`<button type="button" class="option ${exam.answers[i]===o.original?'selected':''}" data-answer="${ESC(o.original)}" role="radio" aria-checked="${exam.answers[i]===o.original}"><span class="letter">${'ABCD'[j]}</span><span>${ESC(o.label)}</span></button>`).join('')}</div></section><div class="exam-actions"><button type="button" data-step="previous" ${i===0?'disabled':''}>← Anterior</button><span class="mono muted">${i+1} / 18</span><button type="button" class="primary" id="nextStep" data-step="next" ${exam.answers[i]===null?'disabled':''}>${i===17?'Finalizar examen':'Siguiente →'}</button></div><p class="auth-error" id="finishError" hidden></p></div>`;
  document.getElementById('leaveExam').addEventListener('click',()=>{if(confirm('¿Salir del examen? El intento quedará sin terminar.')){exam=null;navigate('home')}});
}
async function finishExam(){
  if(!exam||exam.answers.some(x=>x===null)||busy)return;busy=true;
  const b=document.getElementById('nextStep'),err=document.getElementById('finishError');b.disabled=true;b.textContent='Guardando y calificando…';
  try{
    const payload={};exam.items.forEach((q,i)=>{payload[q.id]=exam.answers[i]});
    const {data,error}=await client.rpc('sommo_finalizar_examen',{p_intento:exam.id,p_respuestas:payload});
    if(error)throw error;
    const reviews=new Map(data.revision.map(x=>[x.id,x]));
    latestResult={type:exam.type,name:exam.name,score:data.porcentaje,correct:data.aciertos,total:18,details:exam.items.map(q=>{let r=reviews.get(q.id);return {...r,selectedText:q.options.find(o=>o.original===r.seleccion)?.label||r.seleccion}})};
    exam=null;navigate('results');
  }catch(ex){err.hidden=false;err.textContent='No se pudo guardar: '+(ex.message||String(ex))+'. Tus respuestas siguen aquí: vuelve a intentar.';}
  finally{busy=false;if(b){b.disabled=false;b.textContent='Finalizar examen'}}
}
function renderResults(){

  const r=latestResult,pass=menus[r.type].pass,msg=pass===null?'Resultado diagnóstico':r.correct>=pass?'Buen avance':'Temas por reforzar';

}
async function renderDashboard(){
  if(!profile){navigate('login');return}
  main.innerHTML=`<div class="wrap screen"><button class="back" data-page="home">← Volver al inicio</button><div class="eyebrow" style="margin-top:20px">EMPLEADO / HISTORIAL PERSONAL</div><h1 class="intro-title">Mis<br><em>resultados.</em></h1><p class="intro-lede">Estos resultados están guardados en Supabase y pertenecen solamente a tu usuario.</p><div class="manager-warning">PILOTO TÉCNICO: el panel gerencial privado todavía no está habilitado.</div><p id="loadingHistory">Cargando tu historial…</p><div id="myHistory"></div></div>`;
  const {data,error}=await client.rpc('sommo_mis_resultados');
  if(view!=='dashboard')return;
  const dest=document.getElementById('myHistory');document.getElementById('loadingHistory').hidden=true;
  if(error){dest.textContent='No se pudo cargar el historial: '+error.message;return}
  const h=Array.isArray(data)?data:[];
  dest.innerHTML=`<div class="manager-stats"><div class="manager-stat"><b>${h.length}</b><small>EXÁMENES FINALIZADOS</small></div><div class="manager-stat"><b>${h.length?Math.round(h.reduce((n,x)=>n+Number(x.porcentaje),0)/h.length):0}%</b><small>PROMEDIO</small></div><div class="manager-stat"><b>${ESC(profile.nombre)}</b><small>EMPLEADO</small></div></div><div class="table-scroll">${h.length?`<table class="results-table"><thead><tr><th>FECHA</th><th>EVALUACIÓN</th><th>ACIERTOS</th><th>CALIFICACIÓN</th></tr></thead><tbody>${h.map(x=>`<tr><td>${ESC(new Date(x.fecha).toLocaleString('es-MX'))}</td><td>${ESC(menus[x.tipo]?.name||x.tipo)}</td><td>${x.aciertos}/18</td><td>${x.porcentaje}%</td></tr>`).join('')}</tbody></table>`:`<div class="empty">Todavía no has terminado ningún examen.</div>`}</div>`;
}
document.body.addEventListener('click',async e=>{
  const target=e.target.closest('[data-page],[data-start],[data-retry],[data-answer],[data-step]');if(!target)return;
  if(target.dataset.page){e.preventDefault();navigate(target.dataset.page,{scroll:target.dataset.scroll});return}
  if(target.dataset.start||target.dataset.retry){selectedExamType=target.dataset.start||target.dataset.retry;navigate(profile?'start':'login');return}
  if(target.dataset.answer!==undefined&&exam){exam.answers[exam.index]=target.dataset.answer;renderExam();return}
  if(target.dataset.step&&exam){if(target.dataset.step==='previous'){exam.index=Math.max(0,exam.index-1);renderExam()}else if(exam.answers[exam.index]!==null){if(exam.index===17)await finishExam();else{exam.index++;renderExam()}}}
});
mob.addEventListener('click',()=>{const open=nav.classList.toggle('open');mob.setAttribute('aria-expanded',String(open))});
if(!client){console.error('No se pudo cargar la librería de Supabase. Se necesita conexión a internet.');}
(async()=>{
  // Registrar el listener ANTES de resolver la sesión del enlace de recuperación.
  const recoveryLink=(location.hash.includes('type=recovery')||new URLSearchParams(location.search).get('type')==='recovery');
  navigate('home');
  if(!client)return;
  client.auth.onAuthStateChange((event)=>{
    if(event==='PASSWORD_RECOVERY'){
      recoveryRequested=true;
      navigate('reset');
    }
  });
  try{
    const {data,error}=await client.auth.getSession();
    if(error)throw error;
    if(data.session){
      // En algunos navegadores el evento llega antes o después de getSession().
      if(recoveryLink){recoveryRequested=true;navigate('reset');return;}
      const {data:per,error:perr}=await client.rpc('sommo_mi_perfil');
      if(!perr&&per){profile=per;if(view==='home')navigate('home')}
    }else if(recoveryLink){navigate('forgot')}
  }catch(e){console.error('Sesión no disponible',e);if(recoveryLink)navigate('forgot')}
})();
</script>
</body>
