let studyCategory='comida',studyGroup='Todas',studyQuery='',studyMode='todas',studyIndex=0,studyRevealed=false;
const studyStorageKey=()=>`sommo_study_v8_${staffProfile?.codigo||'visitante'}`;
function loadStudyMarks(){try{return JSON.parse(localStorage.getItem(studyStorageKey())||'{}')}catch{return {}}}
function saveStudyMark(id,status){const all=loadStudyMarks();if(status==='pendiente')delete all[id];else all[id]=status;try{localStorage.setItem(studyStorageKey(),JSON.stringify(all))}catch{}}
function listStudyCards(){const q=studyQuery.trim().toLocaleLowerCase('es');const marks=loadStudyMarks();return STUDY_CARDS.filter(c=>c.cat===studyCategory && (studyGroup==='Todas'||c.group===studyGroup) && (studyMode==='todas'||(studyMode==='repasar'?(marks[c.id]==='repasar'||!marks[c.id]):marks[c.id]==='aprendido')) && (!q||[c.name,c.group,c.keys.join(' '),c.details,c.portion||'',c.note||''].join(' ').toLocaleLowerCase('es').includes(q)));}
function studyTotals(cat){const marks=loadStudyMarks();const c=STUDY_CARDS.filter(x=>x.cat===cat);return {total:c.length,learned:c.filter(x=>marks[x.id]==='aprendido').length};}
function renderStudy(){
 const {total,learned}=studyTotals(studyCategory);
 const cats=Object.entries(STUDY_CATEGORIES).map(([id,c])=>`<button class="study-tab ${studyCategory===id?'active':''}" data-study-cat="${id}" aria-pressed="${studyCategory===id}">${ESC(c.label)}<span>${studyTotals(id).total}</span></button>`).join('');
 main.innerHTML=`<div class="wrap screen study-screen"><button class="back" data-page="home">Volver al inicio</button><div class="eyebrow" style="margin-top:20px">MODO ESTUDIO / SIN CRONÓMETRO</div><h1 class="intro-title">Guía de<br><em>estudio.</em></h1><p class="intro-lede">Aprende la carta por asociaciones sencillas. Primero recuerda las palabras clave; después voltea la tarjeta. Sin cronómetro y sin calificación.</p><div class="study-tabs" role="group" aria-label="Módulos de estudio">${cats}</div><div class="study-utility"><div class="study-count"><b>${learned} / ${total}</b><span>tarjetas aprendidas en este módulo</span><div class="study-track"><div style="width:${total?100*learned/total:0}%"></div></div></div><div class="study-disclaimer">Avance guardado solo en este navegador${staffProfile?' para este empleado':''}. No se suma al examen ni al dashboard.</div></div><div class="study-controls"><label>Familia<select id="studyGroup"></select></label><label>Buscar<input id="studySearch" type="search" autocomplete="off" placeholder="Platillo, ingrediente o palabra clave…" value="${ESC(studyQuery)}"></label><label>Mostrar<select id="studyMode"><option value="todas">Todas</option><option value="repasar">Por repasar</option><option value="aprendidas">Aprendidas</option></select></label></div><div id="studyCanvas" aria-live="polite"></div><div class="study-footer"><p>Esta guía resume información publicada por SOMMO. Preparaciones, cambios de temporada, disponibilidad y alérgenos deben confirmarse con cocina o barra.</p><a href="https://www.sommo.mx/es/menu/gastronomia" target="_blank" rel="noopener noreferrer">Carta de gastronomía</a><a href="https://www.sommo.mx/es/menu/cocteleria" target="_blank" rel="noopener noreferrer">Carta de coctelería</a></div><div class="actions-row"><button data-page="staff">Ir a mis evaluaciones</button><button data-page="manual">Leer protocolos de servicio</button></div></div>`;
 const groups=['Todas',...new Set(STUDY_CARDS.filter(c=>c.cat===studyCategory).map(c=>c.group))];
 document.getElementById('studyGroup').innerHTML=groups.map(g=>`<option value="${ESC(g)}" ${g===studyGroup?'selected':''}>${ESC(g)}</option>`).join('');

 document.getElementById('studyGroup').addEventListener('change',e=>{studyGroup=e.target.value;studyIndex=0;studyRevealed=false;drawStudyCanvas()});
 document.getElementById('studyMode').addEventListener('change',e=>{studyMode=e.target.value;studyIndex=0;studyRevealed=false;drawStudyCanvas()});
 document.getElementById('studySearch').addEventListener('input',e=>{studyQuery=e.target.value;studyIndex=0;studyRevealed=false;drawStudyCanvas()});
 drawStudyCanvas();
}
function drawStudyCanvas(){
 const mount=document.getElementById('studyCanvas');if(!mount)return;
 const list=listStudyCards();if(studyIndex>=list.length)studyIndex=Math.max(0,list.length-1);
 if(!list.length){mount.innerHTML=`<div class="study-empty">No encontramos tarjetas con esos filtros. Cambia la búsqueda o selecciona «Todas».</div>`;return}
 const c=list[studyIndex],marks=loadStudyMarks(),mark=marks[c.id];
 mount.innerHTML=`<div class="study-card-meta"><span>${ESC(c.group)} / ${ESC(STUDY_CATEGORIES[studyCategory].label)}</span><span>${studyIndex+1} de ${list.length}</span></div><button type="button" class="study-card ${studyRevealed?'revealed':''}" id="studyFlip" aria-label="${studyRevealed?'Volver a las palabras clave':'Voltear tarjeta y descubrir ingredientes'}"><span class="study-card-overline">${studyRevealed?'REVERSO / RECUERDA':'ANVERSO / IDENTIFICA'}</span><h2>${ESC(c.name)}</h2>${c.portion?`<p class="study-serving">${ESC(c.portion)}</p>`:``}${studyRevealed?`<p class="study-detail">${ESC(c.details)}</p>${c.hint?`<p class="study-hint"><strong>Cómo recordarlo</strong>${ESC(c.hint)}</p>`:''}${c.note?`<p class="study-note">${ESC(c.note)}</p>`:''}`:`<div class="study-keywords">${c.keys.map(k=>`<span>${ESC(k)}</span>`).join('')}</div>`}<span class="study-turn">${studyRevealed?'Volver a palabras clave':'Tocar para descubrir ingredientes y detalles'}</span></button><div class="study-progress-actions"><div><span class="study-guidance">¿Cómo llevas esta tarjeta?</span><div class="study-mark-actions"><button type="button" id="studyReview" class="${mark==='repasar'?'active':''}">Necesito repasar</button><button type="button" id="studyLearned" class="${mark==='aprendido'?'active':''}">Ya me lo sé</button></div></div><div class="study-pager"><button type="button" id="studyPrev" ${studyIndex===0?'disabled':''}>Anterior</button><button type="button" id="studyNext">${studyIndex===list.length-1?'Volver al inicio':'Siguiente'}</button></div></div>`;
 mount.querySelector('#studyFlip').addEventListener('click',()=>{studyRevealed=!studyRevealed;drawStudyCanvas()});
 mount.querySelector('#studyReview').addEventListener('click',()=>{saveStudyMark(c.id,'repasar');drawStudyCanvas();const {total,learned}=studyTotals(studyCategory);const count=document.querySelector('.study-count b');if(count)count.textContent=`${learned} / ${total}`;const bar=document.querySelector('.study-track>div');if(bar)bar.style.width=`${total?100*learned/total:0}%`});
 mount.querySelector('#studyLearned').addEventListener('click',()=>{saveStudyMark(c.id,'aprendido');drawStudyCanvas();const {total,learned}=studyTotals(studyCategory);const count=document.querySelector('.study-count b');if(count)count.textContent=`${learned} / ${total}`;const bar=document.querySelector('.study-track>div');if(bar)bar.style.width=`${total?100*learned/total:0}%`});
 mount.querySelector('#studyPrev').addEventListener('click',()=>{studyIndex=Math.max(0,studyIndex-1);studyRevealed=false;drawStudyCanvas()});
 mount.querySelector('#studyNext').addEventListener('click',()=>{studyIndex=(studyIndex+1)%list.length;studyRevealed=false;drawStudyCanvas()});
}

function renderManual(){main.innerHTML=`<div class="wrap screen manual"><button class="back" data-page="home"> Volver al inicio</button><div class="eyebrow" style="margin-top:20px">ACADEMY / LECTURAS / 01</div><h1 class="intro-title">Protocolos<br><em>de servicio.</em></h1><p class="intro-lede">Una guía breve para mejorar el ritmo del servicio, la comodidad de los clientes y el trabajo en equipo. Este material es una propuesta para capacitación; no sustituye el protocolo interno aprobado por SOMMO.</p>
 <article class="article"><div class="eyebrow">MANUAL DE PISO · EDICIÓN 01</div><h2>La atención está<br>en los detalles.</h2><p>Un excelente servicio permite que el cliente disfrute la experiencia sin tener que solicitar cada cosa. Estar presente no significa interrumpir constantemente: significa observar, anticiparse y actuar con discreción.</p>
 <h3>01. Una mesa sin «muertos»</h3><p>En servicio, se llama de manera coloquial <strong>«muertos»</strong> a platos vacíos o sucios, vasos usados, servilletas y otros objetos que ya no se necesitan. El objetivo es mantener la mesa cómoda, limpia y ordenada.</p>
 <ul><li>No dejar que se acumulen platos, vasos y utensilios innecesarios.</li><li>Observar cuándo un comensal ha terminado sin apresurarlo.</li><li><strong>Preguntar antes de retirar:</strong> no asumir que un vaso vacío ya puede llevarse o que alguien ha terminado de comer.</li><li>No retirar un plato mientras su dueño sigue comiendo ni interrumpir una conversación innecesariamente.</li><li>Retirar con movimientos seguros, discretos y sin cruzar sobre el comensal.</li></ul>
 <blockquote>«¿Me permite retirar su plato?»<br>«¿Ya terminó o prefiere que se lo deje?»</blockquote>
 <h3>02. Orden y protocolo de servicio</h3><p>En el <strong>protocolo clásico de restaurante</strong>, el orden de servicio se organiza por precedencia y edad. Como referencia para aprender la técnica tradicional:</p>
 <ol><li><strong>Invitado o invitada de honor:</strong> se atiende primero cuando la mesa identifica a una persona homenajeada o invitada especial.</li><li><strong>Mujeres:</strong> se comienza por la de mayor edad y se continúa con las demás.</li><li><strong>Hombres:</strong> se comienza por el de mayor edad y se continúa con los demás.</li><li><strong>Anfitrión o anfitriona:</strong> se sirve al final, después de sus invitados.</li></ol>
 <p><strong>¿Y los niños?</strong> Cuando hay niños pequeños, se procura servirles <strong>lo antes posible</strong>, sin hacerlos esperar hasta terminar toda la secuencia. También se atienden con prioridad práctica las necesidades de personas que requieren asistencia.</p>
 <p><strong>Sentido de servicio:</strong> para desplazarse con orden, se puede continuar <strong>en el sentido de las manecillas del reloj</strong> dentro de cada grupo. Si se aplica prioridad por edad o hay una persona de honor, esta precedencia puede modificar el recorrido.</p>
 <div class="notice"><strong>Aplicación en SOMMO:</strong> este es un protocolo tradicional, no una regla universal. Gerencia debe confirmar si el servicio del restaurante seguirá esta secuencia o utilizará números de asiento y atención por necesidades, como sucede en muchos establecimientos actuales. En cualquier caso, no retrasar los alimentos ni comprometer su temperatura, seguridad o la comodidad de los comensales.</div>
 <p style="font-size:12px;opacity:.68">Referencias de formación: <a href="https://www3.gobiernodecanarias.org/medusa/ecoblog/avennav/la-comanda/" target="_blank" rel="noopener noreferrer">Servicios en Restauración · Gobierno de Canarias</a> · <a href="https://www.webstaurantstore.com/article/90/fine-dining-etiquette-for-servers.html" target="_blank" rel="noopener noreferrer">Fine Dining Etiquette for Servers</a>.</p>
 <h3>03. Anticiparse sin invadir</h3><ul><li>Dar la bienvenida con naturalidad y explicar la carta sin presionar.</li><li>Confirmar alergias, modificaciones y tiempos antes de enviar la comanda.</li><li>Observar el ritmo de la mesa y preguntar antes de ofrecer retirar objetos.</li><li>Consultar a cocina o barra cuando desconozcas un ingrediente o preparación.</li><li>Informar a tiempo si algo se agota o se retrasa; nunca inventar tiempos.</li><li>Preparar la mesa para los siguientes clientes únicamente después de limpiarla y remontarla correctamente.</li></ul>
 <h3>04. Hospitalidad también es seguridad</h3><p>Las alergias no se resuelven retirando un ingrediente del plato. Deben comunicarse a cocina y verificarse ingredientes, preparación y posible contacto cruzado. Ante cristalería rota o un plato caliente, protege al cliente y sigue las medidas de seguridad.</p>
 </article><div class="actions-row"><button data-start="piso">Practicar · primer día en piso </button><button data-page="home">Volver a las evaluaciones</button></div></div>`}

function updateClock(){
 if(!exam||view!=='exam')return;
 const secs=serverRemaining(),el=document.getElementById('timerText'),ring=document.getElementById('timerRing');

 }catch(err){const note=document.getElementById('timerWarning');if(note)note.textContent='Sin conexión. El cronómetro continúa. Reconecta para guardar y finalizar.'}
 finally{clockSyncing=false;}
}

 const dest=document.getElementById('managerPanel');if(!dest)return;
 const request=++managerRequestSerial;
 dest.innerHTML='<p class="auth-note">Consultando los resultados de Supabase…</p>';
 const f={...managerFilters};
 const {data,error}=await client.rpc('sommo_gerente_panel_v71',{
   p_periodo:f.periodo,p_pagina:f.pagina,p_limite:f.limite,p_busqueda:f.busqueda
 });
 if(view!=='dashboard'||request!==managerRequestSerial||!document.getElementById('managerPanel'))return;
 if(error){dest.innerHTML=`<p class="auth-error">${ESC(error.message)}. Revisa que hayas instalado el SQL V7.1 en Supabase.</p>`;return}
 managerData=data;
 const a=data.evaluaciones||[],r=data.resumen||{},total=Number(data.total_filtrado||0),page=Number(data.pagina||1),limit=Number(data.limite||25);
 const numPages=Math.max(1,Math.ceil(total/limit));
 const begin=total?((page-1)*limit+1):0,end=Math.min(page*limit,total);
 const intervalLabel=f.periodo==='30d'?'Últimos 30 días':f.periodo==='90d'?'Últimos 90 días':'Histórico completo';
 const period=new Date().toISOString().slice(0,7);
 dest.innerHTML=`<div class="manager-head"><div><div class="eyebrow">RESULTADOS / SOMMO ACADEMY</div><h2>El equipo,<br><em>en perspectiva.</em></h2></div><p>Elige un periodo para consultar las evaluaciones. Los resultados antiguos se conservan en Supabase.</p></div>
 <div class="manager-filterbar"><div class="field"><label for="managerPeriod">Periodo</label><select id="managerPeriod"><option value="30d" ${f.periodo==='30d'?'selected':''}>Últimos 30 días</option><option value="90d" ${f.periodo==='90d'?'selected':''}>Últimos 90 días</option><option value="historico" ${f.periodo==='historico'?'selected':''}>Histórico completo</option></select></div><div class="field"><label for="managerSearch">Buscar por nombre</label><input type="search" id="managerSearch" value="${ESC(f.busqueda)}" placeholder="Nombre del mesero" autocomplete="off" maxlength="80"></div><div class="field"><label for="managerLimit">Filas por página</label><select id="managerLimit"><option value="25" ${limit===25?'selected':''}>25 resultados</option><option value="50" ${limit===50?'selected':''}>50 resultados</option></select></div></div>
 <div class="manager-stats manager-stats-four"><div class="manager-stat"><b>${Number(data.personal_total||0)}</b><small>PERSONAL REGISTRADO · TOTAL</small></div><div class="manager-stat"><b>${Number(r.finalizados||0)}</b><small>FINALIZADOS · ${ESC(intervalLabel.toUpperCase())}</small></div><div class="manager-stat"><b>${Number(r.en_curso||0)}</b><small>EN CURSO · PERIODO</small></div><div class="manager-stat"><b>${r.promedio===null||r.promedio===undefined?'—':Number(r.promedio)+'%'}</b><small>PROMEDIO · FINALIZADOS</small></div></div>
 <p class="manager-note">${ESC(intervalLabel)} · ${Number(r.pendientes||0)} evaluaciones pendientes · ${Number(r.total||0)} evaluaciones en el periodo. El buscador filtra los resultados por nombre sin alterar estas métricas generales.</p>
 ${Number(data.nombres_repetidos||0)>0?`<div class="manager-warning"><b>Revisión de identidad:</b> Hay ${Number(data.nombres_repetidos)} grupo(s) de nombres repetidos en el personal. Sin SMS, el teléfono declarado no constituye verificación de identidad.</div>`:''}
 <div class="manager-tablehead"><h3>Evaluaciones.</h3><span>${begin}–${end} de ${total} registros encontrados</span></div>
 <div class="table-scroll"><table class="results-table"><thead><tr><th>EMPLEADO</th><th>EVALUACIÓN</th><th>ESTADO / INICIO</th><th>NOTA</th><th>REAPERTURAS</th></tr></thead><tbody>${a.map(x=>`<tr><td><strong>${ESC(x.nombre)}</strong><br><span class="muted">${ESC(x.telefono_final||'Teléfono no registrado')}</span></td><td>${ESC(TYPE(x.tipo))}<br><span class="muted">${ESC(x.periodo)} · #${Number(x.numero||1)}</span></td><td>${x.estado==='finalizado'?(x.motivo==='tiempo'?'Tiempo agotado':'Finalizado'):x.estado==='en_curso'?'En curso':'Pendiente'}${x.inicio?`<br><span class="muted">Inició ${ESC(formatDateTime(x.inicio))}</span>`:''}</td><td>${x.aciertos!==null&&x.aciertos!==undefined?`${Number(x.aciertos)}/18 · ${Math.round(Number(x.aciertos)/18*100)}%`:'—'}</td><td>${Number(x.reanudaciones||0)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No hay evaluaciones para este periodo y búsqueda.</td></tr>'}</tbody></table></div>
 <div class="manager-pages"><span>Página ${page} de ${numPages} · se muestran máximo ${limit} registros por consulta</span><div><button type="button" id="managerPrev" ${page<=1?'disabled':''}> Anterior</button><button type="button" id="managerNext" ${page>=numPages?'disabled':''}>Siguiente</button></div></div>
 <p class="auth-note">Reaperturas = veces que alguien volvió a abrir el mismo intento. Una recarga o falla de conexión también cuenta: no demuestra trampa.</p>
 <details class="manager-exception"><summary>Autorización excepcional de un nuevo intento</summary><form id="assignEmployee"><div class="field"><label for="staffLookup">Buscar empleado para autorizar</label><input type="search" id="staffLookup" maxlength="80" placeholder="Escribe su nombre" autocomplete="off"><p class="auth-note" id="staffLookupHint">Mostrando los primeros 30 empleados activos por orden alfabético.</p></div><div class="field"><label for="staffOption">Empleado</label><select id="staffOption" name="empleado" required><option value="">Cargando personal…</option></select></div><div class="field"><label>Evaluación</label><select name="tipo"><option value="ingreso">Nuevo ingreso</option><option value="piso">Primer día en piso</option><option value="recurrente">Recurrente</option></select></div><div class="field"><label>Periodo</label><input name="periodo" maxlength="32" value="${ESC(period)}" required></div><button class="wide-btn" type="submit">Autorizar otro intento</button><p class="auth-error" id="assignError" hidden></p></form></details>
 <p class="auth-note" style="margin-top:20px">${data.modo_piloto?'PILOTO: las preguntas siguen pendientes de aprobación por SOMMO.':'Antes de uso formal, confirma la revisión del banco.'} Los datos históricos no se eliminan automáticamente; SOMMO debe aprobar una política de conservación antes de activar una depuración.</p>`;
 document.getElementById('managerPeriod')?.addEventListener('change',e=>{managerFilters.periodo=e.target.value;managerFilters.pagina=1;loadManagerPanel()});
 document.getElementById('managerLimit')?.addEventListener('change',e=>{managerFilters.limite=Number(e.target.value);managerFilters.pagina=1;loadManagerPanel()});
 document.getElementById('managerSearch')?.addEventListener('input',e=>{
   const s=e.target.value;clearTimeout(managerSearchTimer);
   managerSearchTimer=setTimeout(()=>{managerFilters.busqueda=s.trim();managerFilters.pagina=1;loadManagerPanel()},450);
 });
 document.getElementById('managerPrev')?.addEventListener('click',()=>{managerFilters.pagina=Math.max(1,managerFilters.pagina-1);loadManagerPanel()});
 document.getElementById('managerNext')?.addEventListener('click',()=>{managerFilters.pagina=Math.min(numPages,managerFilters.pagina+1);loadManagerPanel()});
 const details=dest.querySelector('.manager-exception');
 details?.addEventListener('toggle',()=>{if(details.open){loadStaffManagerOptions('')}});
 document.getElementById('staffLookup')?.addEventListener('input',e=>{
   const lookup=e.target.value;clearTimeout(staffSearchTimer);
   staffSearchTimer=setTimeout(()=>loadStaffManagerOptions(lookup),350);
 });
 document.getElementById('assignEmployee')?.addEventListener('submit',async e=>{
   e.preventDefault();if(busy)return;busy=true;
   const form=e.currentTarget,b=form.querySelector('[type="submit"]');b.disabled=true;
   setError('assignError','');try{
     const {error}=await client.rpc('sommo_gerente_asignar',{p_empleado:form.elements.empleado.value,p_tipo:form.elements.tipo.value,p_periodo:form.elements.periodo.value.trim()});
     if(error)throw error;await loadManagerPanel();
   }catch(err){setError('assignError',err.message||'No se pudo asignar');b.disabled=false}finally{busy=false}
 });
}
let managerStaffSerial=0;
async function loadStaffManagerOptions(busqueda){
 const id=++managerStaffSerial;
 const sel=document.getElementById('staffOption'),hint=document.getElementById('staffLookupHint');
 if(!sel)return;
 sel.innerHTML='<option value="">Buscando…</option>';
 const {data,error}=await client.rpc('sommo_gerente_buscar_personal_v71',{p_busqueda:busqueda.trim(),p_limite:30});
 if(id!==managerStaffSerial||!document.getElementById('staffOption'))return;
 const current=document.getElementById('staffOption');
 if(error){current.innerHTML='<option value="">No se pudo consultar el personal</option>';if(hint)hint.textContent=error.message;return}
 const people=data?.empleados||[];
 current.innerHTML='<option value="">Selecciona un empleado</option>'+people.map(p=>`<option value="${ESC(p.id)}">${ESC(p.nombre)}${p.telefono_final?' · '+ESC(p.telefono_final):''}</option>`).join('');
 if(hint)hint.textContent=people.length===30?'Se muestran hasta 30 coincidencias. Escribe más letras para afinar.':`${people.length} empleado(s) encontrado(s).`;
}
function renderRecover(){
 main.innerHTML=`<div class="wrap screen"><button class="back" data-page="dashboard"> Acceso gerencial</button><div class="eyebrow">GERENCIA / RECUPERACIÓN</div><h1 class="intro-title">Recuperar<br><em>contraseña.</em></h1><div class="panel" style="max-width:550px"><form id="recoverForm"><div class="field"><label>Correo registrado en Supabase Authentication</label><input id="recoverEmail" type="email" required></div><button class="wide-btn" type="submit">Enviar enlace de recuperación</button><p class="auth-error" id="recoverError" hidden></p><p class="auth-note">El envío de correos está sujeto al límite de Supabase. El enlace debe apuntar a esta web en Authentication  URL Configuration.</p></form></div></div>`;
 document.getElementById('recoverForm').addEventListener('submit',async e=>{
 e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;
 const {error}=await client.auth.resetPasswordForEmail(document.getElementById('recoverEmail').value.trim(),{redirectTo:siteUrl});
 if(error)setError('recoverError',error.message);else {setError('recoverError','');alert('Si tu correo está registrado, recibirás instrucciones. Revisa spam.');}
 b.disabled=false;
 });
}
function renderReset(){
 main.innerHTML=`<div class="wrap screen"><div class="eyebrow">GERENCIA / CONTRASEÑA NUEVA</div><h1 class="intro-title">Nueva<br><em>contraseña.</em></h1><div class="panel" style="max-width:560px"><form id="resetForm"><div class="field"><label>Contraseña nueva (mínimo 10 caracteres)</label><input id="resetPass" type="password" minlength="10" autocomplete="new-password" required></div><div class="field"><label>Confirma la contraseña</label><input id="resetPassAgain" type="password" minlength="10" autocomplete="new-password" required></div><button class="wide-btn" type="submit">Guardar contraseña</button><p class="auth-error" id="resetError" hidden></p></form></div></div>`;
 document.getElementById('resetForm').addEventListener('submit',async e=>{
 e.preventDefault();const pass=document.getElementById('resetPass').value;
 if(pass!==document.getElementById('resetPassAgain').value){setError('resetError','Las contraseñas no coinciden');return}
 const {error}=await client.auth.updateUser({password:pass});
 if(error)setError('resetError',error.message);else {recovering=false;alert('Contraseña actualizada');navigate('dashboard')}
 });
}
document.body.addEventListener('click',async e=>{
 const t=e.target.closest('[data-study-shortcut],[data-study-cat],[data-page],[data-start],[data-assignment],[data-answer],[data-step]');if(!t)return;
 if(t.dataset.studyShortcut){studyCategory=t.dataset.studyShortcut;studyGroup='Todas';studyQuery='';studyMode='todas';studyIndex=0;studyRevealed=false;navigate('study');return}
 if(t.dataset.studyCat){studyCategory=t.dataset.studyCat;studyGroup='Todas';studyQuery='';studyMode='todas';studyIndex=0;studyRevealed=false;renderStudy();return}
 if(t.dataset.page){e.preventDefault();navigate(t.dataset.page,{scroll:t.dataset.scroll});return}
 if(t.dataset.start){selectedExamType=t.dataset.start;navigate('staff');return}
 if(t.dataset.assignment){await openAssignment(t.dataset.assignment);return}
 if(t.dataset.answer && exam){await saveAnswer(t.dataset.answer);return}
 if(t.dataset.step && exam){
   if(t.dataset.step==='previous'){exam.index=Math.max(0,exam.index-1);renderExam()}
   else if(exam.items[exam.index].seleccion!==null){
     if(exam.index===17){if(exam.items.every(q=>q.seleccion!==null))await finishExam();else{exam.index=exam.items.findIndex(q=>q.seleccion===null);renderExam()}}
     else{exam.index++;renderExam()}
   }
 }
});
mob.addEventListener('click',()=>{const open=nav.classList.toggle('open');mob.setAttribute('aria-expanded',String(open))});
(async()=>{
 navigate('home');
 if(!client){console.error('Falta la librería Supabase');return}
 client.auth.onAuthStateChange(event=>{
   if(event==='PASSWORD_RECOVERY'){recovering=true;navigate('reset')}
   if(event==='SIGNED_OUT'){managerReady=false;managerData=null}
 });
 if(staffToken){
   try{const {data,error}=await client.rpc('sommo_personal_evaluaciones',{p_token:staffToken});
     if(error)throw error;staffProfile={nombre:data.nombre,codigo:data.codigo};if(view==='home')navigate('home');
     const active=sessionStorage.getItem('sommo_active_assignment_v7');if(active)await openAssignment(active);
   }catch{staffToken='';staffProfile=null;sessionStorage.removeItem('sommo_staff_token_v7')}
 }
 const currentHash=location.hash||'';
 if(/error_code=otp_expired|error_description=.*expired/i.test(currentHash)){
   if(view==='home')navigate('recover');
   return;
 }
 try{
   const {data}=await client.auth.getSession();
   if(data.session){
     if(recovering || /type=recovery/.test(currentHash)){recovering=true;navigate('reset');return}
     const {error}=await client.rpc('sommo_gerente_panel_v71',{p_periodo:'30d',p_pagina:1,p_limite:25,p_busqueda:''});
     if(!error)managerReady=true;
   }
 }catch(e){console.warn('No se pudo revisar la sesión gerencial',e)}
})();

</script>
