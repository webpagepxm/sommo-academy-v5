function renderManual(){main.innerHTML=`<div class="wrap screen manual"><button class="back" data-page="home">← Volver al inicio</button><div class="eyebrow" style="margin-top:20px">ACADEMY / LECTURAS / 01</div><h1 class="intro-title">Protocolos<br><em>de servicio.</em></h1><p class="intro-lede">Una guía breve para mejorar el ritmo del servicio, la comodidad de los clientes y el trabajo en equipo. Este material es una propuesta para capacitación; no sustituye el protocolo interno aprobado por SOMMO.</p>
 <article class="article"><div class="eyebrow">MANUAL DE PISO · EDICIÓN 01</div><h2>La atención está<br>en los detalles.</h2><p>Un excelente servicio permite que el cliente disfrute la experiencia sin tener que solicitar cada cosa. Estar presente no significa interrumpir constantemente: significa observar, anticiparse y actuar con discreción.</p>
 <h3>01. Una mesa sin «muertos»</h3><p>En servicio, se llama de manera coloquial <strong>«muertos»</strong> a platos vacíos o sucios, vasos usados, servilletas y otros objetos que ya no se necesitan. El objetivo es mantener la mesa cómoda, limpia y ordenada.</p>
 <ul><li>No dejar que se acumulen platos, vasos y utensilios innecesarios.</li><li>Observar cuándo un comensal ha terminado sin apresurarlo.</li><li><strong>Preguntar antes de retirar:</strong> no asumir que un vaso vacío ya puede llevarse o que alguien ha terminado de comer.</li><li>No retirar un plato mientras su dueño sigue comiendo ni interrumpir una conversación innecesariamente.</li><li>Retirar con movimientos seguros, discretos y sin cruzar sobre el comensal.</li></ul>
 <blockquote>«¿Me permite retirar su plato?»<br>«¿Ya terminó o prefiere que se lo deje?»</blockquote>
 <h3>02. Orden y protocolo de servicio</h3><p>En el <strong>protocolo clásico de restaurante</strong>, el orden de servicio se organiza por precedencia y edad. Como referencia para aprender la técnica tradicional:</p>
 <ol><li><strong>Invitado o invitada de honor:</strong> se atiende primero cuando la mesa identifica a una persona homenajeada o invitada especial.</li><li><strong>Mujeres:</strong> se comienza por la de mayor edad y se continúa con las demás.</li><li><strong>Hombres:</strong> se comienza por el de mayor edad y se continúa con los demás.</li><li><strong>Anfitrión o anfitriona:</strong> se sirve al final, después de sus invitados.</li></ol>
 <p><strong>¿Y los niños?</strong> Cuando hay niños pequeños, se procura servirles <strong>lo antes posible</strong>, sin hacerlos esperar hasta terminar toda la secuencia. También se atienden con prioridad práctica las necesidades de personas que requieren asistencia.</p>
 <p><strong>Sentido de servicio:</strong> para desplazarse con orden, se puede continuar <strong>en el sentido de las manecillas del reloj</strong> dentro de cada grupo. Si se aplica prioridad por edad o hay una persona de honor, esta precedencia puede modificar el recorrido.</p>
 <div class="notice"><strong>Aplicación en SOMMO:</strong> este es un protocolo tradicional, no una regla universal. Gerencia debe confirmar si el servicio del restaurante seguirá esta secuencia o utilizará números de asiento y atención por necesidades, como sucede en muchos establecimientos actuales. En cualquier caso, no retrasar los alimentos ni comprometer su temperatura, seguridad o la comodidad de los comensales.</div>
 <p style="font-size:12px;opacity:.68">Referencias de formación: <a href="https://www3.gobiernodecanarias.org/medusa/ecoblog/avennav/la-comanda/" target="_blank" rel="noopener noreferrer">Servicios en Restauración · Gobierno de Canarias</a> · <a href="https://www.webstaurantstore.com/article/90/fine-dining-etiquette-for-servers.html" target="_blank" rel="noopener noreferrer">Fine Dining Etiquette for Servers</a>.</p>
 <h3>03. Anticiparse sin invadir</h3><ul><li>Dar la bienvenida con naturalidad y explicar la carta sin presionar.</li><li>Confirmar alergias, modificaciones y tiempos antes de enviar la comanda.</li><li>Observar el ritmo de la mesa y preguntar antes de ofrecer retirar objetos.</li><li>Consultar a cocina o barra cuando desconozcas un ingrediente o preparación.</li><li>Informar a tiempo si algo se agota o se retrasa; nunca inventar tiempos.</li><li>Preparar la mesa para los siguientes clientes únicamente después de limpiarla y remontarla correctamente.</li></ul>
 <h3>04. Hospitalidad también es seguridad</h3><p>Las alergias no se resuelven retirando un ingrediente del plato. Deben comunicarse a cocina y verificarse ingredientes, preparación y posible contacto cruzado. Ante cristalería rota o un plato caliente, protege al cliente y sigue las medidas de seguridad.</p>
 </article><div class="actions-row"><button data-start="piso">Practicar · primer día en piso ↗</button><button data-page="home">Volver a las evaluaciones</button></div></div>`}

 <form class="panel" id="changePin"><h3>Cambiar PIN.</h3><div class="field"><label>Empleado</label><select name="empleado" required><option value="">Selecciona</option>${people.map(p=>`<option value="${ESC(p.id)}">${ESC(p.nombre)} · ${ESC(p.codigo)}</option>`).join('')}</select></div><div class="field"><label>Nuevo PIN (6 números)</label><input name="pin" type="password" pattern="[0-9]{6}" maxlength="6" inputmode="numeric" required></div><button class="wide-btn" type="submit">Actualizar PIN ↗</button><p class="auth-error" id="pinError" hidden></p></form>
 </div><h2 style="font:400 44px var(--serif);margin:50px 0 20px">Historial del equipo.</h2><div class="table-scroll"><table class="results-table"><thead><tr><th>EMPLEADO</th><th>EXAMEN</th><th>PERIODO</th><th>INTENTO</th><th>ESTADO</th><th>RESULTADO</th></tr></thead><tbody>${a.map(x=>`<tr><td>${ESC(x.nombre)}<br><span class="muted">${ESC(x.codigo)}</span></td><td>${ESC(TYPE(x.tipo))}</td><td>${ESC(x.periodo)}</td><td>${x.numero}</td><td>${x.estado==='finalizado'?'Finalizado':x.estado==='en_curso'?'En curso':'Pendiente'}</td><td>${x.aciertos!==null?`${x.aciertos}/18 · ${Math.round(x.aciertos/18*100)}%`:'—'}</td></tr>`).join('')||'<tr><td colspan="6">Todavía no hay evaluaciones asignadas.</td></tr>'}</tbody></table></div><p class="auth-note" style="margin-top:17px">PILOTO: los 250 reactivos siguen pendientes de aprobación por SOMMO. Solo la cuenta marcada como empleado de prueba puede usar preguntas sin validar.</p>`;
 async function submitAction(id,rpc,keys,errorId){
    document.getElementById(id).addEventListener('submit',async e=>{
      e.preventDefault();if(busy)return;busy=true;
      const f=e.currentTarget,b=f.querySelector('[type="submit"]');b.disabled=true;
      setError(errorId,'');
      const obj={};for(const [formKey,apiKey] of Object.entries(keys))obj[apiKey]=f.elements.namedItem(formKey)?.value.trim();
      try{const {error}=await client.rpc(rpc,obj);if(error)throw error;await loadManagerPanel()}
      catch(ex){setError(errorId,ex.message||'No fue posible completar la operación');b.disabled=false}
      finally{busy=false}
    });
 }
 submitAction('createEmployee','sommo_gerente_crear_empleado',
   {nombre:'p_nombre',codigo:'p_codigo',pin:'p_pin'},'createError');
 submitAction('assignEmployee','sommo_gerente_asignar',
   {empleado:'p_empleado',tipo:'p_tipo',periodo:'p_periodo'},'assignError');
 submitAction('changePin','sommo_gerente_cambiar_pin',
   {empleado:'p_empleado',pin:'p_pin'},'pinError');
}
function renderRecover(){
 main.innerHTML=`<div class="wrap screen"><button class="back" data-page="dashboard">← Acceso gerencial</button><div class="eyebrow">GERENCIA / RECUPERACIÓN</div><h1 class="intro-title">Recuperar<br><em>contraseña.</em></h1><div class="panel" style="max-width:550px"><form id="recoverForm"><div class="field"><label>Correo registrado en Supabase Authentication</label><input id="recoverEmail" type="email" required></div><button class="wide-btn" type="submit">Enviar enlace de recuperación ↗</button><p class="auth-error" id="recoverError" hidden></p><p class="auth-note">El envío de correos está sujeto al límite de Supabase. El enlace debe apuntar a esta web en Authentication → URL Configuration.</p></form></div></div>`;
 document.getElementById('recoverForm').addEventListener('submit',async e=>{
 e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;
 const {error}=await client.auth.resetPasswordForEmail(document.getElementById('recoverEmail').value.trim(),{redirectTo:siteUrl});
 if(error)setError('recoverError',error.message);else {setError('recoverError','');alert('Si tu correo está registrado, recibirás instrucciones. Revisa spam.');}
 b.disabled=false;
 });
}
function renderReset(){
 main.innerHTML=`<div class="wrap screen"><div class="eyebrow">GERENCIA / CONTRASEÑA NUEVA</div><h1 class="intro-title">Nueva<br><em>contraseña.</em></h1><div class="panel" style="max-width:560px"><form id="resetForm"><div class="field"><label>Contraseña nueva (mínimo 10 caracteres)</label><input id="resetPass" type="password" minlength="10" autocomplete="new-password" required></div><div class="field"><label>Confirma la contraseña</label><input id="resetPassAgain" type="password" minlength="10" autocomplete="new-password" required></div><button class="wide-btn" type="submit">Guardar contraseña ↗</button><p class="auth-error" id="resetError" hidden></p></form></div></div>`;
 document.getElementById('resetForm').addEventListener('submit',async e=>{
 e.preventDefault();const pass=document.getElementById('resetPass').value;
 if(pass!==document.getElementById('resetPassAgain').value){setError('resetError','Las contraseñas no coinciden');return}
 const {error}=await client.auth.updateUser({password:pass});
 if(error)setError('resetError',error.message);else {recovering=false;alert('Contraseña actualizada');navigate('dashboard')}
 });
}
document.body.addEventListener('click',async e=>{
 const t=e.target.closest('[data-page],[data-start],[data-assignment],[data-answer],[data-step]');if(!t)return;
 if(t.dataset.page){e.preventDefault();navigate(t.dataset.page,{scroll:t.dataset.scroll});return}
 if(t.dataset.start){selectedExamType=t.dataset.start;navigate('staff');return}
 if(t.dataset.assignment){await openAssignment(t.dataset.assignment);return}
 if(t.dataset.answer && exam){await saveAnswer(t.dataset.answer);return}
 if(t.dataset.step && exam){
   if(t.dataset.step==='previous'){exam.index=Math.max(0,exam.index-1);renderExam()}
   else if(exam.items[exam.index].seleccion!==null){
     if(exam.index===17){if(exam.items.every(q=>q.seleccion!==null))await finishExam();else{exam.index=exam.items.findIndex(q=>q.seleccion===null);renderExam()}}
     else{exam.index++;renderExam()}
   }
 }
});
mob.addEventListener('click',()=>{const open=nav.classList.toggle('open');mob.setAttribute('aria-expanded',String(open))});
(async()=>{
 navigate('home');
 if(!client){console.error('Falta la librería Supabase');return}
 client.auth.onAuthStateChange(event=>{
   if(event==='PASSWORD_RECOVERY'){recovering=true;navigate('reset')}
   if(event==='SIGNED_OUT'){managerReady=false;managerData=null}
 });
 if(staffToken){
   try{const {data,error}=await client.rpc('sommo_personal_evaluaciones',{p_token:staffToken});
     if(error)throw error;staffProfile={nombre:data.nombre,codigo:data.codigo};if(view==='home')navigate('home');
   }catch{staffToken='';staffProfile=null;localStorage.removeItem('sommo_staff_token_v6')}
 }
 const currentHash=location.hash||'';
 if(/error_code=otp_expired|error_description=.*expired/i.test(currentHash)){
   if(view==='home')navigate('recover');
   return;
 }
 try{
   const {data}=await client.auth.getSession();
   if(data.session){
     if(recovering || /type=recovery/.test(currentHash)){recovering=true;navigate('reset');return}
     const {error}=await client.rpc('sommo_gerente_panel');
     if(!error)managerReady=true;
   }
 }catch(e){console.warn('No se pudo revisar la sesión gerencial',e)}
})();

</script>
